<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>講習詳細 | STC 下関トレーニングセンター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@300;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #0b1120; color: #f1f5f9; }
        .font-en { font-family: 'Montserrat', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .spec-label { background: linear-gradient(90deg, #0ea5e9 0%, transparent 100%); padding: 4px 12px; border-left: 4px solid #fff; font-style: italic; font-weight: 900; font-size: 0.75rem; color: #fff; letter-spacing: 0.1em; }
        .hero-gradient { background: radial-gradient(circle at 20% 50%, rgba(14, 165, 233, 0.15) 0%, transparent 50%); }
    </style>
</head>
<body class="hero-gradient min-h-screen pb-20">

    <nav class="p-6">
        <a href="index.html" class="inline-flex items-center text-white/50 hover:text-sky-400 transition font-black italic text-xs tracking-widest uppercase">
            <i class="fas fa-arrow-left mr-2"></i> Back to Home
        </a>
    </nav>

    <main class="container mx-auto px-6 py-12 max-w-5xl">
        <div class="grid lg:grid-cols-2 gap-16 items-start">
            
            <!-- 左側：ビジュアル & PDF -->
            <div class="lg:sticky lg:top-24">
                <div class="relative mb-8">
                    <span id="course-id-en" class="font-en font-black text-sky-600/20 text-8xl absolute -top-10 -left-4 italic select-none uppercase">DETAILS</span>
                    <h1 id="course-name" class="text-3xl md:text-5xl font-black italic leading-tight text-white relative z-10 uppercase tracking-tighter">講習コース詳細</h1>
                </div>
                
                <div class="rounded-3xl overflow-hidden shadow-2xl mb-8 border border-white/10 group bg-slate-800">
                    <img id="course-img" src="course1.jpg" alt="講習イメージ" class="w-full h-64 object-cover group-hover:scale-105 transition duration-700">
                </div>

                <a id="pdf-link" href="#" download class="w-full glass-card p-6 rounded-2xl flex items-center justify-between hover:bg-white/10 transition group border-l-4 border-l-red-500 shadow-xl">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-red-500/20 rounded-xl flex items-center justify-center text-red-500 text-2xl"><i class="fas fa-file-pdf"></i></div>
                        <div class="text-left">
                            <p class="text-[10px] text-white/40 font-black italic uppercase tracking-widest">Application Form</p>
                            <p class="text-white font-black italic">受講申込書(PDF)をダウンロード</p>
                        </div>
                    </div>
                    <i class="fas fa-download text-white/20 group-hover:text-white group-hover:translate-y-1 transition text-xl"></i>
                </a>
            </div>

            <!-- 右側：スペック詳細（画像から文字起こしした全データ） -->
            <div class="space-y-10">
                <div class="reveal">
                    <h2 class="text-sky-400 font-black italic tracking-widest text-xs mb-6 uppercase border-b border-sky-400/30 pb-2">Technical Specifications</h2>
                    
                    <div class="space-y-8">
                        <div>
                            <div class="spec-label mb-3 uppercase">コース説明</div>
                            <p id="desc" class="text-slate-300 font-bold italic leading-loose text-sm pl-4 whitespace-pre-wrap"></p>
                        </div>

                        <div class="grid grid-cols-2 gap-8 pl-4">
                            <div>
                                <div class="spec-label mb-3 uppercase">受講資格</div>
                                <p id="eligibility" class="text-white font-black italic"></p>
                            </div>
                            <div>
                                <div class="spec-label mb-3 uppercase">受講条件</div>
                                <p id="condition" class="text-white font-black italic whitespace-pre-wrap"></p>
                            </div>
                        </div>

                        <div>
                            <div class="spec-label mb-3 uppercase">対応重機・業務</div>
                            <p id="machines" class="text-white font-black italic pl-4 whitespace-pre-wrap"></p>
                        </div>

                        <div class="bg-sky-600/10 p-8 rounded-3xl border border-sky-500/20 shadow-inner">
                            <div class="spec-label mb-4 uppercase">受講料金</div>
                            <div class="flex items-baseline gap-2 pl-4">
                                <span id="price" class="text-5xl font-en font-black italic text-sky-400"></span>
                                <span class="text-white font-black italic text-xl">円</span>
                                <span id="tax-note" class="text-white/40 text-[10px] ml-4 font-bold italic"></span>
                            </div>
                        </div>

                        <div class="glass-card p-6 rounded-2xl">
                            <div class="spec-label mb-3 uppercase text-white">講習時間・その他</div>
                            <ul id="others" class="text-xs text-white/70 font-bold italic space-y-3 pl-4 list-none">
                                <!-- JSで動的に追加 -->
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="pt-8">
                    <a href="index.html#schedule-section" class="block w-full bg-gradient-to-r from-sky-500 to-sky-600 text-white text-center py-6 rounded-full font-black text-lg italic tracking-[0.2em] hover:shadow-[0_20px_50px_rgba(14,165,233,0.4)] hover:-translate-y-1 transition duration-500 uppercase shadow-xl">
                        <i class="fas fa-calendar-check mr-3"></i> 開催予定を確認・申込む
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const courseData = {
            'tamakake': {
                name: '玉掛け技能講習<br><span class="text-sky-500 text-2xl">(19時間コース)</span>',
                en: 'SLINGING',
                img: 'course1.jpg',
                desc: 'つり上げ荷重に制限なく、移動式クレーン・クレーン・デリック・又は揚貨装置等の玉掛けの業務が可能になる資格取得コースです。未経験の方を対象とした、標準コースです。',
                eligibility: '満18歳以上の方',
                condition: '未経験の方',
                machines: 'クレーン・移動式クレーン・デリック・揚貨装置等',
                price: '25,000',
                tax: '(テキスト代1,800円、及び消費税込み)',
                others: ['学科講習12時間 / 実技講習7時間','講習日数：3日','最低開催人数：4名'],
                pdf: 'pdf/tamakake.pdf'
            },
            'crane': {
                name: '小型移動式クレーン運転技能講習<br><span class="text-sky-500 text-2xl">(16時間コース)</span>',
                en: 'CRANE',
                img: 'course3.jpg',
                desc: 'つり上げ荷重が5トン未満の小型移動式クレーンの運転業務が可能になる資格取得コースです。以下の修了証もしくは免許保有者を対象としたコースです。',
                eligibility: '満18歳以上の方',
                condition: 'A.玉掛けまたは、床上操作式クレーン運転技能講習修了証を持っている\nB.クレーン、デリックまたは、揚貨装置運転士免許持っている',
                machines: 'つり上げ荷重5トン未満の、クローラーキャリア搭載クレーン/積載型トラッククレーン/トラッククレーン/ホイールクレーン等',
                price: '35,000',
                tax: '(テキスト代1,800円、及び消費税込み)',
                others: ['学科講習10時間 / 実技講習6時間','講習日数：3日','最低開催人数：4名'],
                pdf: 'pdf/crane.pdf'
            },
            'fork31': {
                name: 'フォークリフト運転技能講習<br><span class="text-sky-500 text-2xl">(31時間コース)</span>',
                en: 'FORKLIFT',
                img: 'course2.jpg',
                desc: '最大荷重1トン以上(最大荷重に制限なし)のフォークリフトの運転の業務を行うことができる資格です。',
                eligibility: '満18歳以上の方',
                condition: '(普通・準中・中型・大型)自動車免許をお持ちの者',
                machines: 'カウンタバランスフォークリフト / リーチフォークリフト / サイドフォークリフト / オーダピッキングフォークリフト / ウォーキーフォークリフト / マルチディレクショナルフォークリフト等',
                price: '30,000',
                tax: '(テキスト代2,000円、及び消費税込み)',
                others: ['学科講習：7時間 / 実技講習：24時間','講習日数：4日','最低開催人数：4名'],
                pdf: 'pdf/fork31.pdf'
            },
            'fork11': {
                name: 'フォークリフト運転技能講習<br><span class="text-sky-500 text-2xl">(11時間コース)</span>',
                en: 'FORKLIFT',
                img: 'course2.jpg',
                desc: '最大荷重1トン以上(最大荷重に制限なし)のフォークリフトの運転の業務を行うことができる資格です。',
                eligibility: '満18歳以上の方',
                condition: '・大型特殊自動車運転免許をお持ちの者\n・(普通・準中・中型・大型)自動車免許をお持ちで、フォークリフト特別教育修了後、フォークリフトの運転業務経験が3ヶ月以上ある者',
                machines: 'カウンタバランスフォークリフト / リーチフォークリフト / サイドフォークリフト / 等',
                price: '20,000',
                tax: '(テキスト代2,000円、及び消費税込み)',
                others: ['学科講習：7時間 / 実技講習：4時間','講習日数：2日','最低開催人数：4名'],
                pdf: 'pdf/fork11.pdf'
            },
            'tailgate': {
                name: 'テールゲートリフターの操作の業務に係る特別教育',
                en: 'TAILGATE',
                img: 'course1.jpg',
                desc: '荷を積み卸す作業におけるテールゲートリフターの操作の業務を行う者を対象とした講習です。',
                eligibility: '満18歳以上の方',
                condition: '未経験の方',
                machines: 'トラック等のテールゲートリフター操作全般',
                price: '15,000',
                tax: '(テキスト代2,000円、及び消費税込み)',
                others: ['学科講習4時間 / 実技講習2時間','講習日数：1日','最低開催人数：4名','※開講日については、参加企業の業務日程に併せて調整させていただきますので、お電話にてお問い合わせ下さい。'],
                pdf: 'pdf/tail.pdf'
            }
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || 'tamakake';
        const data = courseData[id];

        if(data) {
            document.getElementById('course-name').innerHTML = data.name;
            document.getElementById('course-id-en').innerText = data.en;
            document.getElementById('course-img').src = data.img;
            document.getElementById('desc').innerText = data.desc;
            document.getElementById('eligibility').innerText = data.eligibility;
            document.getElementById('condition').innerText = data.condition;
            document.getElementById('machines').innerText = data.machines;
            document.getElementById('price').innerText = data.price;
            document.getElementById('tax-note').innerText = data.tax;
            document.getElementById('pdf-link').href = data.pdf;
            
            const othersList = document.getElementById('others');
            data.others.forEach(text => {
                const li = document.createElement('li');
                li.innerText = `※ ${text}`;
                othersList.appendChild(li);
            });
        }
    </script>
</body>
</html>
