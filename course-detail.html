<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>講習詳細 | STC 下関トレーニングセンター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
   <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@400;700;900&display=swap');
    
    :root { --navy: #001a33; --accent: #00a2ff; }
    body { font-family: 'Noto Sans JP', sans-serif; background-color: #ffffff; color: var(--navy); }
    .font-en { font-family: 'Montserrat', sans-serif; }

    /* 背景：白を基調にしつつ、清潔感のある微細なドットパターン */
    .bg-dot { background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 20px 20px; }

    /* セクションタイトル：極太のアクセントライン */
    .section-title { border-left: 8px solid var(--accent); padding-left: 1.5rem; margin-bottom: 2rem; }
    .section-title h2 { font-weight: 900; font-style: italic; font-size: 1.25rem; letter-spacing: 0.1em; color: var(--navy); }

    /* カード：枠線を消し、深い「重厚な影」で浮かせる */
    .heavy-card { background: white; border-radius: 2rem; box-shadow: 0 40px 100px rgba(0, 26, 51, 0.08); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    .heavy-card:hover { transform: translateY(-10px); box-shadow: 0 50px 120px rgba(0, 26, 51, 0.12); }

    /* 料金ボックス：最高級の重厚グラデーション */
    .price-box { background: linear-gradient(135deg, #001a33 0%, #003366 100%); border-radius: 3rem; position: relative; overflow: hidden; }
    .price-box::before { content: 'PRICE'; position: absolute; top: -10%; right: -5%; font-family: 'Montserrat'; font-size: 10rem; color: rgba(255,255,255,0.03); font-weight: 900; font-style: italic; }

    /* 申込ボタン：ネオン感のあるモダンデザイン */
    .btn-stc { background: var(--navy); color: white; transition: 0.5s; border: 2px solid var(--navy); }
    .btn-stc:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.02); box-shadow: 0 20px 40px rgba(0, 162, 255, 0.3); }

    .reveal { opacity: 0; transform: translateY(30px); transition: 1s cubic-bezier(0.16, 1, 0.3, 1); }
    .reveal.active { opacity: 1; transform: translateY(0); }
</style>
</head>
<body class="pb-20">
    <div class="bg-bright-effect"></div>
    <div class="bg-glow-bright"></div>

    <nav class="p-8">
        <a href="index.html#courses" class="inline-flex items-center text-slate-400 hover:text-sky-600 transition font-black italic text-xs tracking-widest group">
            <i class="fas fa-chevron-left mr-3 group-hover:-translate-x-2 transition-transform"></i> 一覧に戻る / BACK
        </a>
    </nav>

    <main class="container mx-auto px-6 max-w-6xl">
        <div class="grid lg:grid-cols-2 gap-16 items-start">
            
            <!-- 左側：ビジュアルセクション -->
            <div class="lg:sticky lg:top-12">
                <div class="relative mb-8 reveal active">
                    <span id="course-id-en" class="font-en font-black text-sky-600/5 text-8xl absolute -top-12 -left-4 italic select-none uppercase tracking-tighter leading-none">COURSE</span>
                    <h1 id="course-name" class="text-4xl md:text-6xl font-black italic leading-tight text-slate-900 relative z-10 uppercase tracking-tighter"></h1>
                </div>
                
                <div class="rounded-[2.5rem] overflow-hidden shadow-2xl mb-10 border-4 border-white group">
                    <img id="course-img" src="" alt="講習イメージ" class="w-full h-80 object-cover group-hover:scale-105 transition duration-[2s]">
                </div>

                <!-- PDFダウンロード -->
                <a id="pdf-link" href="#" download class="w-full glass-white-card p-8 rounded-[2rem] flex items-center justify-between group border-2 border-white">
                    <div class="flex items-center gap-6 text-left">
                        <div class="w-16 h-16 bg-red-500 rounded-2xl flex items-center justify-center text-white text-3xl shadow-lg group-hover:rotate-6 transition"><i class="fas fa-file-pdf"></i></div>
                        <div>
                            <span class="label-en-sub text-slate-400">APPLICATION FORM</span>
                            <p class="text-slate-800 font-black italic text-xl">受講申込書(PDF)をダウンロード</p>
                        </div>
                    </div>
                    <i class="fas fa-download text-sky-500 transition text-2xl"></i>
                </a>
            </div>

            <!-- 右カラム：全情報を網羅したスペック詳細 -->
            <div class="lg:col-span-7 space-y-14">
                
                <!-- 1. コース説明 -->
                <div class="reveal active">
                    <div class="border-l-[8px] border-l-accent pl-6 mb-6">
                        <span class="font-en text-[10px] font-black text-accent tracking-[0.3em] block mb-1">COURSE OVERVIEW</span>
                        <h2 class="text-navy font-black text-2xl italic uppercase">コース説明</h2>
                    </div>
                    <p id="desc" class="text-slate-600 font-bold italic leading-loose text-xl pl-2"></p>
                </div>

                <!-- 2. 受講資格 ＆ 受講条件（グリッド） -->
                <div class="grid md:grid-cols-2 gap-6 reveal active">
                    <!-- 受講対象 -->
                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border-l-[10px] border-l-navy flex flex-col justify-between hover:border-l-accent transition-all duration-500">
                        <div>
                            <span class="font-en text-[9px] font-black text-slate-400 tracking-widest block mb-4">TARGET</span>
                            <p class="text-slate-500 font-black text-xs mb-2">受講対象</p>
                            <div class="text-navy font-black italic text-2xl" id="eligibility"></div>
                        </div>
                        <p class="text-[10px] text-slate-400 mt-6 font-bold italic underline decoration-accent/30 underline-offset-4">※満18歳以上の方</p>
                    </div>
                    <!-- 受講要件 -->
                    <div class="bg-white p-8 rounded-[2rem] shadow-xl border-l-[10px] border-l-slate-300 flex flex-col hover:border-l-navy transition-all duration-500">
                        <span class="font-en text-[9px] font-black text-slate-400 tracking-widest block mb-4">REQUIREMENT</span>
                        <p class="text-slate-500 font-black text-xs mb-2">受講要件</p>
                        <div class="text-slate-700 font-bold italic text-base leading-relaxed whitespace-pre-wrap" id="condition"></div>
                    </div>
                </div>

                <!-- 3. 対応重機・業務 -->
                <div class="reveal active">
                    <div class="border-l-[8px] border-l-navy pl-6 mb-6">
                        <span class="font-en text-[10px] font-black text-accent tracking-[0.3em] block mb-1">APPLICABLE MACHINES</span>
                        <h2 class="text-navy font-black text-2xl italic uppercase">対応重機・業務</h2>
                    </div>
                    <div class="bg-slate-50 p-10 rounded-[2.5rem] border-2 border-white shadow-inner">
                        <p id="machines" class="text-navy font-black italic text-lg leading-relaxed whitespace-pre-wrap"></p>
                    </div>
                </div>

                <!-- 4. 料金ボックス（最大の重厚感） -->
                <div class="bg-gradient-to-br from-[#001a33] to-[#003366] p-12 rounded-[3rem] text-white shadow-2xl relative overflow-hidden reveal active group">
                    <!-- 背景の巨大なPRICE透かし -->
                    <div class="absolute -bottom-10 -right-10 font-en text-[10rem] font-black italic opacity-[0.03] pointer-events-none select-none">PRICE</div>
                    
                    <div class="relative z-10">
                        <span class="font-en text-[10px] font-black text-sky-400 tracking-[0.4em] block mb-6">INVESTMENT</span>
                        <h2 class="text-xl font-black italic mb-10 border-b border-white/10 pb-4 inline-block">受講料金（税込・テキスト代込）</h2>
                        <div class="flex items-baseline gap-4">
                            <span id="price" class="text-8xl md:text-9xl font-en font-black italic tracking-tighter text-white drop-shadow-2xl"></span>
                            <span class="text-2xl font-black italic opacity-60">円</span>
                        </div>
                        <p id="tax-note" class="text-sky-200/50 text-xs mt-10 font-bold italic pt-6 border-t border-white/5"></p>
                    </div>
                </div>

                <!-- 5. 講習日数・その他 -->
                <div class="reveal active">
                    <div class="border-l-[8px] border-l-slate-400 pl-6 mb-6">
                        <span class="font-en text-[10px] font-black text-slate-400 tracking-[0.3em] block mb-1">DETAILS</span>
                        <h2 class="text-navy font-black text-2xl italic uppercase">講習日数・その他</h2>
                    </div>
                    <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-50">
                        <ul id="others" class="text-lg text-slate-700 font-bold italic space-y-6"></ul>
                    </div>
                </div>

                <!-- 6. 申し込みボタン（9/1開始への伏線も考慮） -->
                <div class="pt-10 reveal active">
                    <a href="index.html#schedule-section" class="bg-[#001a33] hover:bg-[#00a2ff] text-white block w-full text-center py-10 rounded-full font-[900] text-2xl italic tracking-[0.3em] shadow-2xl transition-all duration-500 hover:scale-[1.02] uppercase border-2 border-[#001a33]">
                        <i class="fas fa-calendar-alt mr-4"></i> 開催予定を確認・申込む
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-20 text-center opacity-30 font-black italic text-[10px] tracking-[0.5em] uppercase text-slate-400">
        SHIMONOSEKI TRAINING CENTER
    </footer>

    <script>
        const courseData = {
            'tamakake': {
                name: '玉掛け技能講習<br><span class="text-sky-500 text-2xl md:text-3xl italic">(19時間コース)</span>',
                en: 'SLINGING', img: 'course1.jpg',
                desc: 'つり上げ荷重に制限なく、移動式クレーン・クレーン・デリック・又は揚貨装置等の玉掛けの業務が可能になる資格取得コースです。未経験の方を対象とした、標準コースです。',
                eligibility: '経験不問', condition: '未経験の方',
                machines: 'クレーン・移動式クレーン・デリック・揚貨装置等',
                price: '25,000', tax: '※ テキスト代 1,800円、及び消費税を含む。',
                others: ['学科講習 12時間 / 実技講習 7時間','講習日数：3日間','最低開催人数：4名','定員に満たない場合、中止することがあります。'],
                pdf: 'pdf/tamakake.pdf'
            },
            'crane': {
                name: '小型移動式クレーン<br><span class="text-sky-500 text-2xl md:text-3xl italic">(16時間コース)</span>',
                en: 'MOBILE CRANE', img: 'course3.jpg',
                desc: 'つり上げ荷重が5トン未満の小型移動式クレーンの運転業務が可能になる資格取得コースです。',
                eligibility: '有資格者対象', condition: 'A.玉掛け技能講習修了証所持\nB.クレーン・デリック等の免許所持',
                machines: 'つり上げ荷重5トン未満の、クローラーキャリア搭載クレーン、積載型トラッククレーン、トラッククレーン、ホイールクレーン等',
                price: '35,000', tax: '※ テキスト代 1,800円、及び消費税を含む。',
                others: ['学科講習 10時間 / 実技講習 6時間','講習日数：3日間','最低開催人数：4名'],
                pdf: 'pdf/crane.pdf'
            },
            'fork31': {
                name: 'フォークリフト運転<br><span class="text-sky-500 text-2xl md:text-3xl italic">(31時間コース)</span>',
                en: 'FORKLIFT 31H', img: 'course2.jpg',
                desc: '最大荷重1トン以上のフォークリフトの運転業務を行うことができる資格です。自動車免許所持者を対象としています。',
                eligibility: '免許所持者', condition: '普通・中型・大型自動車免許をお持ちの方',
                machines: 'カウンタバランスフォークリフト、リーチフォークリフト、サイドフォークリフト、オーダーピッキングフォークリフト、ウォーキーフォークリフト、マルチディレクショナルフォークリフト等',
                price: '30,000', tax: '※ テキスト代 2,000円、及び消費税を含む。',
                others: ['学科講習 7時間 / 実技講習 24時間','講習日数：4日間','最低開催人数：4名'],
                pdf: 'pdf/fork31.pdf'
            },
            'fork11': {
                name: 'フォークリフト運転<br><span class="text-sky-500 text-2xl md:text-3xl italic">(11時間コース)</span>',
                en: 'FORKLIFT 11H', img: 'course2.jpg',
                desc: '最大荷重1トン以上のフォークリフトの運転業務を行うことができる資格です。大型特殊免許所持者、または特別教育修了後の実務経験者を対象としています。',
                eligibility: '特定経験・資格者', condition: '・大型特殊免許所持者\n・普通免許所持＋特別教育後実務3ヶ月以上',
                machines: 'カウンタバランスフォークリフト、リーチフォークリフト、サイドフォークリフト、オーダーピッキングフォークリフト、ウォーキーフォークリフト、マルチディレクショナルフォークリフト等',
                price: '20,000', tax: '※ テキスト代 2,000円、及び消費税を含む。',
                others: ['学科講習 7時間 / 実技講習 4時間','講習日数：2日間','最低開催人数：4名'],
                pdf: 'pdf/fork11.pdf'
            },
            'tailgate': {
                name: 'テールゲートリフター<br><span class="text-sky-500 text-2xl md:text-3xl italic">(特別教育)</span>',
                en: 'TAILGATE LIFTER', img: 'hero.png',
                desc: '荷を積み卸す作業におけるテールゲートリフターの操作の業務を行う方を対象とした特別教育です。',
                eligibility: '経験不問', condition: '未経験の方',
                machines: 'トラック等のテールゲートリフター操作全般',
                price: '15,000', tax: '※ テキスト代 2,000円、及び消費税を含む。',
                others: ['学科講習 4時間 / 実技講習 2時間','講習日数：1日間','企業の業務日程に合わせて調整可能です。'],
                pdf: 'pdf/tail.pdf'
            }
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || 'tamakake';
        const data = courseData[id];

        if(data) {
            document.getElementById('course-name').innerHTML = data.name;
            document.getElementById('course-id-en').innerText = data.en;
            document.getElementById('course-img').src = data.img;
            document.getElementById('desc').innerText = data.desc;
            document.getElementById('eligibility').innerText = data.eligibility;
            document.getElementById('condition').innerText = data.condition;
            document.getElementById('machines').innerText = data.machines;
            document.getElementById('price').innerText = data.price;
            document.getElementById('tax-note').innerText = data.tax;
            document.getElementById('pdf-link').href = data.pdf;
            
            const othersList = document.getElementById('others');
            data.others.forEach(text => {
                const li = document.createElement('li');
                li.innerHTML = `<div class="flex items-start gap-4"><i class="fas fa-check-circle text-sky-500 mt-1"></i><span>${text}</span></div>`;
                othersList.appendChild(li);
            });
        }
    </script>
</body>
</html>
