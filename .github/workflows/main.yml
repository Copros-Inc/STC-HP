name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  pull_request:  # ← これを追加することで下書き時も動くようになります
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COPROS_INC_STC }}'
          projectId: stc-hp
          # channelId を指定しないことで、PRの時はプレビュー、mainの時は本番へ自動で出し分けられます
