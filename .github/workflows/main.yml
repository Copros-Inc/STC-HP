name: Deploy to GitHub Pages Preview
on:
  push:
    branches:
      - main
  pull_request: # PR作成時にプレビューを動かす
permissions:
  contents: write # プレビュー作成に必要
  pages: write
  id-token: write
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: . # ルートディレクトリを公開
