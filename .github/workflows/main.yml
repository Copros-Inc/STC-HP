name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  pull_request: # これでプレビュー作成が復活します
permissions:
  checks: write
  contents: read
  pull-requests: write # プレビューURLを書き込むために必要
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COPROS_INC_STC }}'
          projectId: stc-hp
          expires: 1h # 1時間でプレビューを消して容量を節約
