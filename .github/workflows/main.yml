name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  pull_request: # プレビュー作成を復活
permissions:
  checks: write
  contents: read
  pull-requests: write # PRにコメントを残すために必要
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_COPROS_INC_STC }}'
          projectId: stc-hp
          # ここを修正：PR時はプレビュー、main時は本番へ
          expires: 1h # プレビューの有効期限を1時間に設定（容量節約）
