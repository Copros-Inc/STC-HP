<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場レポート & ブログ | STC 下関トレーニングセンター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
        <style>
        :root { --navy: #001a33; --accent: #00a2ff; }
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; color: var(--navy); overflow-x: hidden; }
        .parallax { background-attachment: fixed; background-position: center; background-size: cover; position: relative; }
        
        /* エフェクト1：ふわっと浮き上がるアニメーション */
        .reveal { opacity: 0; transform: translateY(30px); transition: 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* エフェクト2：タイトルのキラリと光るアニメーション */
        .shine-text {
            position: relative; overflow: hidden;
        }
        .shine-text::after {
            content: ''; position: absolute; top: -50%; left: -60%; width: 20%; height: 200%;
            background: rgba(255, 255, 255, 0.3); transform: rotate(30deg);
            animation: shine 4s infinite;
        }
        @keyframes shine { 0% { left: -60%; } 20% { left: 120%; } 100% { left: 120%; } }

        /* エフェクト3：カードのホバー（ネオングロー） */
        .blog-card { background: white; border-radius: 2.5rem; overflow: hidden; transition: all 0.5s; border: 1px solid #e2e8f0; }
        .blog-card:hover { 
            transform: translateY(-12px) scale(1.02); 
            box-shadow: 0 30px 60px rgba(0, 162, 255, 0.15); 
            border-color: var(--accent); 
        }

        @media (max-width: 768px) { .parallax { background-attachment: scroll; } }

                /* 下層ページ専用スマホヘッダー調整（index完全同期版） */
        @media (max-width: 768px) {
            h1.font-\[900\] { font-size: 11px !important; }
            header p.text-\[6px\], header p.text-\[8px\] { 
                display: block !important; 
                font-size: 7px !important; 
                color: #00a2ff !important; 
                letter-spacing: -0.01em !important; 
                max-width: none !important; 
                overflow: visible !important; 
                white-space: nowrap !important;
            }
        }
    </style>
</head>
<body>

    <!-- 0. SUBPAGE HEADER (背景濃紺固定・index同期・HOMEボタン版) -->
    <header class="fixed top-0 w-full z-50 py-4 bg-[#001a33] shadow-xl" id="sub-nav">
        <div class="max-w-[1500px] mx-auto flex justify-start items-center px-4 md:px-8 gap-2">
            
            <!-- ロゴ & センター名 -->
            <a href="index.html" class="flex items-center gap-3 group shrink-0">
                <div class="bg-white p-1 rounded shadow-lg shrink-0">
                    <img src="logo.png" alt="STC" class="h-8 md:h-12 object-contain">
                </div>
                <div class="text-left text-white leading-none shrink-0">
                    <h1 class="font-[900] text-[10px] md:text-lg italic uppercase tracking-tighter">下関トレーニングセンター</h1>
                    <p class="text-[6px] md:text-[8px] text-[#00a2ff] font-black uppercase tracking-[0.2em]">Shimonoseki Training Center</p>
                </div>
            </a>

            <!-- PC用メニュー：現状維持 -->
            <nav class="hidden xl:flex items-center gap-x-3 2xl:gap-x-5 text-white text-[12px] font-[900] italic uppercase mx-auto px-4 whitespace-nowrap">
                <a href="index.html#service" class="hover:text-[#00a2ff] transition">事業内容</a>
                <a href="index.html#courses" class="hover:text-[#00a2ff] transition">主要コース</a>
                <a href="features.html" class="hover:text-[#00a2ff] transition">選ばれる理由</a>
                <a href="index.html#schedule-section" class="hover:text-[#00a2ff] transition">開催予定</a>
                <a href="points.html" class="hover:text-[#00a2ff] transition">受講ガイド</a>
                <a href="index.html#access" class="hover:text-[#00a2ff] transition">Access</a>
                <a href="blog.html" class="bg-white/10 px-3 py-1 rounded">ブログ</a>
            </nav>

            <!-- アクションエリア：スマホではHOMEボタンのみ -->
            <div class="flex items-center gap-2 ml-auto shrink-0">
                <!-- PC用お問合せ -->
                <a href="tel:0832460556" class="hidden xl:flex bg-[#00a2ff] text-white px-6 py-3 rounded-full shadow-lg border-2 border-[#00a2ff] hover:bg-white hover:text-[#001a33] transition-all items-center justify-center gap-2">
                    <i class="fas fa-phone-alt text-xs"></i><span class="text-xs font-black italic">お問合せ</span>
                </a>
                
                <!-- スマホ用：HOMEボタン（正確にindexのブログセクションへ戻る） -->
                <a href="index.html#blog-section" class="xl:hidden bg-white/10 text-white px-3 py-2 rounded-lg border border-white/20 flex items-center gap-1.5 text-[10px] font-black italic">
                    <i class="fas fa-home"></i> HOME
                </a>
            </div>
        </div>
    </header>
    
    <!-- 1. BLOG HERO (教室の写真をパララックスで) -->
    <section class="parallax h-[50vh] flex items-center justify-center text-center" style="background-image: url('bg-blog.jpg');">
        <!-- 膜を少し濃くして、文字とのコントラストを上げます -->
        <div class="absolute inset-0 bg-[#001a33]/70 backdrop-blur-[2px]"></div>
        
        <div class="relative z-10 px-4">
            <h2 class="text-white text-6xl md:text-9xl font-[900] italic uppercase tracking-tighter drop-shadow-[0_10px_30px_rgba(0,0,0,0.5)]">Blog</h2>
            <!-- キャッチコピー：法改正などの重要性も含めた表現に変更 -->
            <p class="text-[#00a2ff] font-[900] tracking-[0.3em] text-sm md:text-2xl mt-6 italic uppercase drop-shadow-lg">
                確かな知識が、安全な現場を創る。
            </p>
            <div class="h-1.5 w-20 bg-[#00a2ff] mx-auto mt-6 rounded-full shadow-lg"></div>
        </div>
    </section>

    <!-- 2. BLOG LIST -->
    <main class="py-24 bg-white min-h-screen">
        <div class="container mx-auto px-6 max-w-7xl">
            <!-- 記事一覧（ここにFirebaseからデータが入ります） -->
            <div id="blog-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 text-left">
                <!-- 読み込み中表示 -->
                <p class="col-span-full text-center py-20 text-slate-400 font-bold italic animate-pulse">最新の記事を読み込み中...</p>
            </div>
            
            <!-- ページネーション（必要に応じて） -->
            <div class="mt-20 text-center">
                <button class="bg-slate-100 text-[#001a33] px-10 py-4 rounded-full font-[900] italic hover:bg-accent hover:text-white transition-all shadow-lg">もっと読み込む</button>
            </div>
        </div>
    </main>

    <!-- 3. FOOTER -->
    <footer class="bg-[#001a33] text-white py-24 text-center">
        <div class="container mx-auto px-6">
            <img src="logo.png" alt="STC" class="h-20 mx-auto mb-8 opacity-80">
            <h2 class="text-2xl font-[900] italic mb-12">下関トレーニングセンター</h2>
            <p class="text-white/20 text-[10px] tracking-[0.5em] font-bold uppercase">&copy; 2026 SHIMONOSEKI TRAINING CENTER.</p>
        </div>
    </footer>

    <!-- LOGIC: FIREBASE BLOG SYSTEM -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw",
            authDomain: "stc-hp.firebaseapp.com",
            projectId: "stc-hp",
            storageBucket: "stc-hp.firebasestorage.app",
            messagingSenderId: "795332931918",
            appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function loadBlogs() {
            const blogList = document.getElementById('blog-list');
            const q = query(collection(db, "blogs"), orderBy("createdAt", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    blogList.innerHTML = '<p class="col-span-full text-center py-20 text-slate-300 font-bold italic text-xl">現在、ブログ記事を準備中です。</p>';
                    return;
                }
                
                blogList.innerHTML = snapshot.docs.map(doc => {
                    const data = doc.data();
                    
                    // 1. 日付の変換
                    let dateStr = 'NEW';
                    if (data.createdAt) {
                        const dateObj = data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt);
                        dateStr = dateObj.toLocaleDateString('ja-JP');
                    }
                    
                    // 2. カテゴリー別カラー設定（管理画面の文字と完全一致）
                    const colors = {
                        '資格・講習ガイド': '#001a33', // 濃紺
                        '法改正・業界ニュース': '#7f1d1d', // 赤
                        '現場レポート': '#064e3b', // 緑
                        '重要なお知らせ': '#0c4a6e', // 青
                    };
                    const themeColor = colors[data.category] || '#001a33';

                    // Tailwind用グラデーション色設定
                    const tailwindColor = 
                        data.category === '法改正・業界ニュース' ? 'from-red-900' : 
                        data.category === '現場レポート' ? 'from-emerald-900' : 
                        data.category === '重要なお知らせ' ? 'from-sky-900' : 'from-[#001a33]';

                    // 3. 表示する画像の決定（なければ模型写真）
                    const displayImg = data.image ? data.image : './bg-blog-default.jpg';

                    // 4. 画像セクションの生成（オーバーレイ & カテゴリー別背景 & 新タグデザイン）
                    const imageSection = `
                        <div class="aspect-video overflow-hidden relative bg-slate-900">
                               <img src="${displayImg}" class="w-full h-full object-cover group-hover:scale-110 transition duration-1000">
                               <div class="absolute inset-0 bg-gradient-to-t ${tailwindColor} via-transparent to-transparent opacity-70"></div>
                               
                               <!-- 左上のカテゴリータグ（indexと統一） -->
                               <div class="absolute top-4 left-4 z-20 px-3 py-1 rounded shadow-xl text-[10px] font-[900] uppercase tracking-widest text-white border border-white/20" 
                                    style="background-color: ${themeColor};">
                                   ${data.category || 'INFO'}
                               </div>
                               
                               <!-- 画像がない場合のみ中央にアイコンを表示 -->
                               ${!data.image ? `
                                <div class="absolute inset-0 flex items-center justify-center text-white/5">
                                    <i class="fas fa-book-reader text-7xl"></i>
                                </div>
                               ` : ''}
                        </div>`;

                    return `
                        <article class="blog-card shadow-xl group cursor-pointer reveal active" onclick="location.href='blog-detail.html?id=${doc.id}'">
                            ${imageSection}
                            <div class="p-8 md:p-10 text-left">
                                <p class="text-accent font-black text-xs mb-4 italic font-en">${dateStr} UPDATE</p>
                                <h3 class="text-2xl font-[900] text-[#001a33] mb-6 leading-tight group-hover:text-accent transition-colors line-clamp-2">${data.title || '無題の記事'}</h3>
                                <p class="text-slate-500 text-sm font-bold leading-loose line-clamp-3">${data.summary || ''}</p>
                                <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-between">
                                    <span class="text-[10px] font-black text-slate-400 italic">READ MORE</span>
                                    <i class="fas fa-chevron-right text-accent transform group-hover:translate-x-2 transition"></i>
                                </div>
                            </div>
                        </article>
                    `;
                }).join('');
            });
        }

        loadBlogs();

      window.addEventListener('scroll', () => {
        const nav = document.getElementById('sub-nav');
        if (window.pageYOffset > 50) {
            nav.classList.add('py-2');
            nav.classList.remove('py-4');
        } else {
            nav.classList.add('py-4');
            nav.classList.remove('py-2');
        }
    });      
    </script>
</body>
</html>
