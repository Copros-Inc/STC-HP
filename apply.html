<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受講お申し込み | STC 下関トレーニングセンター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@300;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .form-card { background: white; border-radius: 2rem; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .section-title { position: relative; padding-left: 1.5rem; font-weight: 900; }
        .section-title::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #0ea5e9; border-radius: 3px; }
        .cta-button:disabled { background: #94a3b8; cursor: not-allowed; }
        .photo-box { border: 2px dashed #cbd5e1; border-radius: 1rem; overflow: hidden; transition: all 0.3s; background: #f8fafc; aspect-ratio: 4/3; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .photo-box:hover { border-color: #0ea5e9; background: #f0f9ff; }
        input[type="checkbox"], input[type="radio"] { width: 1.2rem; height: 1.2rem; cursor: pointer; }
        .input-field { width: 100%; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-weight: bold; background: #f8fafc; outline: none; }
        .input-label { display: block; text-[10px] font-black text-slate-400 mb-1 uppercase tracking-widest; }
    </style>
</head>
<body class="pb-20">
    <nav class="bg-slate-900 text-white py-6 px-8 mb-12">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="font-black italic text-xl tracking-tighter text-sky-400 uppercase">STC Application</div>
            <a href="index.html" class="text-xs font-bold hover:text-sky-400 transition italic uppercase">← Back to Home</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-black italic tracking-tighter text-slate-900 mb-2 uppercase">受講お申し込み</h1>
            <p id="mode-text" class="text-slate-500 font-bold text-sm italic tracking-widest">Full Web Application</p>
        </div>

        <form id="applyForm" class="space-y-10">
            <!-- 01. 講習確認 -->
            <section class="form-card p-8 md:p-12">
                <h2 class="section-title text-xl mb-8 italic uppercase">01. Selected Course</h2>
                <div class="grid md:grid-cols-2 gap-8">
                    <div><label class="input-label">Course Name</label><input type="text" id="courseName" name="courseName" readonly class="w-full bg-transparent border-none font-black text-sky-600 text-lg outline-none"></div>
                    <div><label class="input-label">Schedule</label><input type="text" id="courseDate" name="courseDate" readonly class="w-full bg-transparent border-none font-black text-slate-700 text-lg outline-none"></div>
                </div>
                <div class="mt-8 p-6 bg-sky-50 rounded-2xl border border-sky-100 flex justify-between items-center">
                    <div><p class="input-label text-sky-600">Tuition Fee</p><p class="text-2xl font-black italic text-slate-900" id="displayFee">--</p></div>
                </div>
                <div id="subsidy-section" class="mt-8 pt-8 border-t border-slate-100 hidden">
                    <label class="block text-xs font-black text-slate-700 mb-4">人材開発支援助成金を利用しますか？</label>
                    <div class="flex gap-6"><label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="subsidy" value="利用する"> <span class="text-sm font-bold">利用する</span></label><label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="subsidy" value="利用しない" checked> <span class="text-sm font-bold">利用しない</span></label></div>
                </div>
            </section>

            <!-- 02. 受講者情報 -->
            <section class="form-card p-8 md:p-12">
                <h2 class="section-title text-xl mb-8 italic uppercase">02. Personal Info</h2>
                <div class="space-y-6 text-left">
                    <div class="grid md:grid-cols-2 gap-6">
                        <input type="text" name="userName" required class="input-field" placeholder="氏名（漢字）*">
                        <input type="text" name="userKana" required class="input-field" placeholder="フリガナ *">
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <input type="text" name="maidenName" class="input-field" placeholder="旧姓・通称の希望あれば記入">
                        <input type="date" name="birthDate" required class="input-field">
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <input type="text" name="zip" required class="input-field" placeholder="現住所（郵便番号）*">
                        <input type="tel" name="phone" required class="input-field" placeholder="電話番号 *">
                    </div>
                    <input type="text" name="address" required class="input-field" placeholder="現住所（市区町村・番地）*">
                    <input type="email" name="email" required class="input-field" placeholder="メールアドレス *">
                    
                    <div class="mt-10 pt-10 border-t border-slate-100 space-y-6" id="comp-section">
                        <h3 class="font-black text-slate-900 italic uppercase">Employment / 勤務先</h3>
                        <div class="grid md:grid-cols-2 gap-6">
                            <input type="text" name="company" class="input-field" placeholder="会社名">
                            <input type="text" name="compPhone" class="input-field" placeholder="会社電話番号">
                            <input type="text" name="compZip" class="input-field" placeholder="会社郵便番号">
                            <input type="text" name="compAddress" class="input-field" placeholder="会社住所">
                        </div>
                    </div>
                </div>
            </section>

            <!-- 03. 写真（WEB申込のみ表示） -->
            <section id="section-photo" class="form-card p-8 md:p-12">
                <h2 class="section-title text-xl mb-8 italic uppercase text-left">03. Profile Photo</h2>
                <div class="flex flex-col md:flex-row items-center gap-8">
                    <div id="pre_user" class="w-32 h-40 bg-slate-50 flex items-center justify-center rounded-xl overflow-hidden border-2 border-dashed border-slate-200 shadow-inner"><i class="fas fa-camera text-slate-300 text-3xl"></i></div>
                    <div class="flex-1 text-center md:text-left space-y-4">
                        <input type="file" id="in_user" accept="image/*" class="hidden" onchange="processImg(this, 'user')">
                        <button type="button" onclick="document.getElementById('in_user').click()" class="bg-slate-900 text-white px-8 py-3 rounded-full text-xs font-black italic uppercase">Select Photo</button>
                    </div>
                </div>
            </section>

            <!-- 動的分岐（WEB申込のみ表示） -->
            <div id="dynamic-section"></div>

            <!-- 04. 支払・領収書 -->
            <section class="form-card p-8 md:p-12">
                <h2 class="section-title text-xl mb-8 italic uppercase text-left">04. Payment & Receipt</h2>
                <div class="space-y-6 text-left">
                    <p class="text-sm font-bold">支払方法：銀行振込（1週間前までに入金）</p>
                    <div class="flex flex-wrap items-center gap-6">
                        <label class="flex items-center gap-2 whitespace-nowrap"><input type="radio" name="receipt" value="不要" checked> <span class="text-sm font-bold">不要</span></label>
                        <div class="flex items-center gap-2 flex-1"><label class="flex items-center gap-2 whitespace-nowrap"><input type="radio" name="receipt" value="必要"> <span class="text-sm font-bold">必要</span></label><input type="text" name="receiptName" class="input-field py-1 text-xs" placeholder="宛名"></div>
                    </div>
                </div>
            </section>

            <!-- 05. 同意事項 -->
            <section class="form-card p-8 md:p-12 bg-slate-900 text-white border-none shadow-2xl">
                <h2 class="text-sky-400 font-black italic text-xl mb-8 uppercase">05. Confirmation</h2>
                <div class="space-y-4 text-left" id="consent-list">
                    <label class="flex gap-4 cursor-pointer p-2 rounded-lg hover:bg-white/5"><input type="checkbox" class="consent-check"> <span class="text-[10px] font-bold text-slate-300">本申込書に虚偽の記載が無いことを確約します。</span></label>
                    <label class="flex gap-4 cursor-pointer p-2 rounded-lg hover:bg-white/5"><input type="checkbox" class="consent-check"> <span class="text-[10px] font-bold text-slate-300">自らが反社会的勢力に属さないことを確約します。</span></label>
                    <label class="flex gap-4 cursor-pointer p-2 rounded-lg hover:bg-white/5"><input type="checkbox" class="consent-check"> <span class="text-[10px] font-bold text-slate-300">当講習所内では一切の講習妨害行為をしないことを確約します。</span></label>
                    <label class="flex gap-4 cursor-pointer p-2 rounded-lg hover:bg-white/5"><input type="checkbox" class="consent-check"> <span class="text-[10px] font-bold text-slate-300">講習中、上記事項に反することが判明した場合、退場することに同意します。</span></label>
                    <label class="flex gap-4 cursor-pointer p-2 rounded-lg hover:bg-white/5"><input type="checkbox" class="consent-check"> <span class="text-[10px] font-bold text-slate-300">これにより損害が生じても講習所は一切賠償しないことに同意します。</span></label>
                    <label class="flex gap-4 cursor-pointer p-2 rounded-lg hover:bg-white/5"><input type="checkbox" class="consent-check"> <span class="text-[10px] font-bold text-slate-300">予期せぬ事態で講習が開催できなかった場合、教習所は一切賠償しないことに同意します。</span></label>
                    <label class="flex gap-4 cursor-pointer p-2 rounded-lg hover:bg-white/5"><input type="checkbox" class="consent-check"> <span class="text-[10px] font-bold text-sky-300 underline">遅刻・早退・欠席は失格となり、返金できないことを承知しました。</span></label>
                </div>
                <button type="submit" id="submitBtn" disabled class="cta-button w-full mt-10 bg-gradient-to-r from-sky-400 to-sky-600 text-white py-6 rounded-2xl font-black text-lg italic uppercase shadow-xl">Send Application</button>
            </section>
        </form>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw", authDomain: "stc-hp.firebaseapp.com", projectId: "stc-hp", storageBucket: "stc-hp.firebasestorage.app", messagingSenderId: "795332931918", appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let photos = { user: "", licA: "", licB: "", spA: "", spB: "", emp: "" };

        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const course = decodeURIComponent(params.get('course') || "");
            const date = decodeURIComponent(params.get('date') || "");
            const mode = params.get('mode') || "full";

            document.getElementById('courseName').value = course;
            document.getElementById('courseDate').value = date;
            
            if (mode === 'simple') {
                document.getElementById('mode-text').innerText = "Simple Reservation (Paper Later)";
                document.getElementById('section-photo').style.display = 'none';
                document.getElementById('submitBtn').innerText = "予約を確定する（当日紙を持参）";
                updateCourseUI(course, true);
            } else {
                updateCourseUI(course, false);
            }
        });

        function updateCourseUI(course, isSimple) {
            const feeEl = document.getElementById('displayFee');
            const subsidyEl = document.getElementById('subsidy-section');
            const dynamicEl = document.getElementById('dynamic-section');
            let fee = "金額未定";
            let html = "";

            if (course.includes("玉掛け")) fee = "¥25,000-"; 
            else if (course.includes("小型移動式クレーン")) fee = "¥35,000-";
            else if (course.includes("31H")) fee = "¥30,000-";
            else if (course.includes("11H")) fee = "¥20,000-";
            else if (course.includes("テールゲート")) fee = "¥15,000-";

            feeEl.innerText = fee;
            if (course.includes("玉掛け") || course.includes("小型移動式クレーン")) subsidyEl.classList.remove('hidden');

            if (!isSimple) {
                if (course.includes("小型移動式クレーン")) {
                    html = `<section class="form-card p-8 md:p-12 animate-fadeIn text-left space-y-6">
                        <h2 class="section-title text-xl italic text-sky-600 uppercase">Qualification</h2>
                        <div class="space-y-4">
                            <label class="flex gap-4 p-4 border rounded-xl"><input type="radio" name="exType" value="玉掛" onchange="window.toggleEx('cr_a')"> <span class="text-sm font-bold">玉掛け技能講習修了証所持</span></label>
                            <label class="flex gap-4 p-4 border rounded-xl"><input type="radio" name="exType" value="免許" onchange="window.toggleEx('cr_b')"> <span class="text-sm font-bold">クレーン等免許所持</span></label>
                        </div>
                        <div id="cr_a_fields" class="hidden space-y-4 p-4 bg-slate-50 rounded-xl">
                            <input type="date" name="exDate" class="input-field bg-white">
                            <input type="text" name="exNo" class="input-field bg-white" placeholder="修了証番号">
                            <input type="text" name="exOrg" class="input-field bg-white" placeholder="交付機関">
                            <div class="flex gap-4"><label><input type="radio" name="exDetail" value="玉掛け"> 玉掛け</label><label><input type="radio" name="exDetail" value="床上操作"> 床上操作</label></div>
                        </div>
                        <div id="cr_b_fields" class="hidden space-y-4 p-4 bg-slate-50 rounded-xl">
                            <input type="date" name="exDateB" class="input-field bg-white">
                            <input type="text" name="exNoB" class="input-field bg-white" placeholder="免許証番号">
                            <input type="text" name="exOrgB" class="input-field bg-white" placeholder="交付局名">
                            <div class="flex gap-4"><label><input type="radio" name="exDetailB" value="クレーン"> クレーン</label><label><input type="radio" name="exDetailB" value="デリック"> デリック</label></div>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div onclick="document.getElementById('in_licA').click()" class="photo-box" id="pre_licA"><i class="fas fa-camera mb-1"></i><span class="text-[8px]">証本【表】</span></div>
                            <div onclick="document.getElementById('in_licB').click()" class="photo-box" id="pre_licB"><i class="fas fa-camera mb-1"></i><span class="text-[8px]">証本【裏】</span></div>
                        </div>
                    </section>`;
                } else if (course.includes("31H")) {
                    html = `<section class="form-card p-8 md:p-12 animate-fadeIn text-left space-y-4">
                        <h2 class="section-title text-xl italic text-sky-600 uppercase">License</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <label class="flex gap-2"><input type="checkbox" name="licT" value="普通"> 普通</label><label class="flex gap-2"><input type="checkbox" name="licT" value="大型"> 大型</label><label class="flex gap-2"><input type="checkbox" name="licT" value="大特"> 大特(キャタ)</label>
                        </div>
                        <input type="text" name="licNo" class="input-field" placeholder="免許証番号">
                        <div class="grid grid-cols-2 gap-4">
                            <div onclick="document.getElementById('in_licA').click()" class="photo-box" id="pre_licA"><span>免許証【表】</span></div>
                            <div onclick="document.getElementById('in_licB').click()" class="photo-box" id="pre_licB"><span>免許証【裏】</span></div>
                        </div>
                    </section>`;
                } else if (course.includes("11H")) {
                    html = `<section class="form-card p-8 md:p-12 animate-fadeIn text-left space-y-6">
                        <h2 class="section-title text-xl italic text-sky-600 uppercase">Qualification / A or B</h2>
                        <div class="space-y-4">
                            <label class="flex gap-4 p-4 border rounded-xl"><input type="radio" name="f11" value="A" onchange="window.toggleEx('f_a')"> <span class="text-sm font-bold text-sky-600">A：大型特殊免許(限定なし)所持</span></label>
                            <label class="flex gap-4 p-4 border rounded-xl"><input type="radio" name="f11" value="B" onchange="window.toggleEx('f_b')"> <span class="text-sm font-bold text-rose-600">B：実務経験3ヶ月以上</span></label>
                        </div>
                        <div id="f_a_fields" class="hidden space-y-4 p-4 bg-slate-50 rounded-xl">
                            <input type="text" name="licNo" class="input-field bg-white" placeholder="大特(限定なし)免許番号">
                            <div class="grid grid-cols-2 gap-4">
                                <div onclick="document.getElementById('in_licA').click()" class="photo-box" id="pre_licA"><span>大特免許【表】</span></div>
                                <div onclick="document.getElementById('in_licB').click()" class="photo-box" id="pre_licB"><span>大特免許【裏】</span></div>
                            </div>
                        </div>
                        <div id="f_b_fields" class="hidden space-y-6 p-4 bg-slate-50 rounded-xl">
                            <input type="text" name="spNo" class="input-field bg-white" placeholder="特教番号">
                            <input type="text" name="mcName" class="input-field bg-white" placeholder="メーカー・型式">
                            <input type="text" name="mcExp" class="input-field bg-white" placeholder="経験期間">
                            <div class="grid grid-cols-2 gap-4">
                                <div onclick="document.getElementById('in_spA').click()" class="photo-box" id="pre_spA"><span>特教証【表】</span></div>
                                <div onclick="document.getElementById('in_spB').click()" class="photo-box" id="pre_spB"><span>特教証【裏】</span></div>
                                <div onclick="document.getElementById('in_emp').click()" class="photo-box col-span-2" id="pre_emp"><span>事業所証明(社印)を撮影</span></div>
                            </div>
                        </div>
                    </section>`;
                }
            }
            dynamicEl.innerHTML = html;
        }

        window.toggleEx = (type) => {
            document.getElementById('cr_a_fields')?.classList.toggle('hidden', type !== 'cr_a');
            document.getElementById('cr_b_fields')?.classList.toggle('hidden', type !== 'cr_b');
            document.getElementById('f_a_fields')?.classList.toggle('hidden', type !== 'f_a');
            document.getElementById('f_b_fields')?.classList.toggle('hidden', type !== 'f_b');
        };

        window.processImg = (input, key) => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX = 400; const scale = MAX / img.width;
                    canvas.width = MAX; canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, MAX, canvas.height);
                    photos[key] = canvas.toDataURL('image/jpeg', 0.7);
                    const pre = document.getElementById(`pre_${key}`);
                    if(pre) pre.innerHTML = `<img src="${photos[key]}" class="w-full h-full object-cover">`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        };

        document.querySelectorAll('.consent-check').forEach(c => c.addEventListener('change', () => {
            document.getElementById('submitBtn').disabled = !Array.from(document.querySelectorAll('.consent-check')).every(i => i.checked);
        }));

        document.getElementById('applyForm').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = "SENDING...";
            const mode = new URLSearchParams(window.location.search).get('mode') || "full";
            try {
                const formData = new FormData(e.target);
                await addDoc(collection(db, "reservations"), {
                    courseName: document.getElementById('courseName').value, courseDate: document.getElementById('courseDate').value,
                    userName: formData.get('userName'), userKana: formData.get('userKana'), birthDate: formData.get('birthDate'), phone: formData.get('phone'), email: formData.get('email'), address: formData.get('address'),
                    mode: mode, createdAt: serverTimestamp(), status: 'new',
                    photos: photos
                });
                if (mode === 'simple') {
                    const pdfMap = { "玉掛け技能講習": "pdf/tamakake.pdf", "小型移動式クレーン": "pdf/crane.pdf", "フォークリフト (31H)": "pdf/fork.pdf", "フォークリフト (11H)": "pdf/fork.pdf", "テールゲート": "pdf/tail.pdf" };
                    alert("予約完了！書類をダウンロードして当日お持ちください。"); window.location.href = pdfMap[document.getElementById('courseName').value] || "pdf/common.pdf";
                } else {
                    alert("送信完了！"); window.location.href = "index.html";
                }
            } catch (err) { alert(err.message); btn.disabled = false; }
        });
    </script>

    <!-- 隠しinput -->
    <input type="file" id="in_licA" accept="image/*" class="hidden" onchange="processImg(this, 'licA')">
    <input type="file" id="in_licB" accept="image/*" class="hidden" onchange="processImg(this, 'licB')">
    <input type="file" id="in_spA" accept="image/*" class="hidden" onchange="processImg(this, 'spA')">
    <input type="file" id="in_spB" accept="image/*" class="hidden" onchange="processImg(this, 'spB')">
    <input type="file" id="in_emp" accept="image/*" class="hidden" onchange="processImg(this, 'emp')">
</body>
</html>
