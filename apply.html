<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>受講お申し込み | STC 下関トレーニングセンター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Noto+Sans+JP:wght@300;700;900&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .font-en { font-family: 'Montserrat', sans-serif; }
        .form-card { background: white; border-radius: 2rem; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 20px 50px rgba(0,0,0,0.05); }
        .section-title { position: relative; padding-left: 1.5rem; font-weight: 900; }
        .section-title::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #0ea5e9; border-radius: 3px; }
        input[type="checkbox"] { width: 1.5rem; height: 1.5rem; cursor: pointer; }
        .photo-preview { width: 120px; height: 150px; border: 2px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 0.5rem; }
        .cta-button:disabled { background: #94a3b8; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    </style>
</head>
<body class="pb-20">
    <nav class="bg-slate-900 text-white py-6 px-8 mb-12">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="font-black italic text-xl tracking-tighter">STC <span class="text-sky-400">APPLICATION</span></div>
            <a href="index.html" class="text-xs font-bold hover:text-sky-400 transition italic uppercase">← Back to Home</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-black italic tracking-tighter text-slate-900 mb-4 uppercase">受講お申し込み</h1>
            <p class="text-slate-500 font-bold text-sm italic">Application Form for Training Course</p>
        </div>

        <form id="applyForm" class="space-y-10">
            <!-- 01. 選んだ講習 -->
            <section class="form-card p-8 md:p-12">
                <h2 class="section-title text-xl mb-8 italic uppercase">01. Selected Course / 選択された講習</h2>
                <div class="grid md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase italic tracking-widest text-left">Selected Course</label>
                        <input type="text" id="courseName" name="courseName" readonly class="w-full bg-slate-50 border-none font-black text-sky-600 text-lg outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase italic tracking-widest text-left">Schedule</label>
                        <input type="text" id="courseDate" name="courseDate" readonly class="w-full bg-slate-50 border-none font-black text-slate-700 text-lg outline-none">
                    </div>
                </div>
            </section>

            <!-- 02. 基本情報 -->
            <section class="form-card p-8 md:p-12">
                <h2 class="section-title text-xl mb-8 italic uppercase text-left">02. Personal Info / 基本情報</h2>
                <div class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6 text-left">
                        <div>
                            <label class="block text-xs font-black text-slate-700 mb-2">氏名（漢字）*</label>
                            <input type="text" name="userName" required class="w-full px-4 py-3 border border-slate-200 rounded-xl font-bold" placeholder="下関 太郎">
                        </div>
                        <div>
                            <label class="block text-xs font-black text-slate-700 mb-2">フリガナ *</label>
                            <input type="text" name="userKana" required class="w-full px-4 py-3 border border-slate-200 rounded-xl font-bold" placeholder="シモノセキ タロウ">
                        </div>
                    </div>
                    <div class="grid md:grid-cols-2 gap-6 text-left">
                        <div>
                            <label class="block text-xs font-black text-slate-700 mb-2">生年月日 *</label>
                            <input type="date" name="birthDate" required class="w-full px-4 py-3 border border-slate-200 rounded-xl font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-black text-slate-700 mb-2">電話番号 *</label>
                            <input type="tel" name="phone" required class="w-full px-4 py-3 border border-slate-200 rounded-xl font-bold" placeholder="083-246-0556">
                        </div>
                    </div>
                    <div class="text-left">
                        <label class="block text-xs font-black text-slate-700 mb-2">メールアドレス *</label>
                        <input type="email" name="email" required class="w-full px-4 py-3 border border-slate-200 rounded-xl font-bold" placeholder="stc@example.com">
                    </div>
                    <div class="text-left">
                        <label class="block text-xs font-black text-slate-700 mb-2">現住所 *</label>
                        <input type="text" name="address" required class="w-full px-4 py-3 border border-slate-200 rounded-xl font-bold" placeholder="山口県下関市...">
                    </div>
                    <div class="text-left">
                        <label class="block text-xs font-black text-slate-700 mb-2">勤務先会社名</label>
                        <input type="text" name="company" class="w-full px-4 py-3 border border-slate-200 rounded-xl font-bold" placeholder="株式会社〇〇">
                    </div>
                </div>
            </section>

            <!-- 03. 写真添付 -->
            <section class="form-card p-8 md:p-12">
                <h2 class="section-title text-xl mb-8 italic uppercase text-left">03. Photo / 証明写真添付</h2>
                <div class="flex flex-col md:flex-row items-center gap-8">
                    <div id="preview" class="photo-preview bg-slate-50 text-slate-400"><i class="fas fa-user text-4xl"></i></div>
                    <div class="text-left">
                        <input type="file" id="photoInput" accept="image/*" class="hidden">
                        <button type="button" onclick="document.getElementById('photoInput').click()" class="bg-slate-900 text-white px-6 py-3 rounded-full text-xs font-black italic uppercase hover:bg-sky-600 transition">Select Photo</button>
                    </div>
                </div>
            </section>

            <!-- 分岐項目 -->
            <div id="dynamic-section"></div>

            <!-- 04. 同意事項 -->
            <section class="form-card p-8 md:p-12 bg-slate-50 border-2 border-sky-100">
                <div class="space-y-4 text-left">
                    <label class="flex gap-4 cursor-pointer"><input type="checkbox" class="consent-check"> <span class="text-xs font-bold">反社会的勢力に属さないことを誓約します</span></label>
                    <label class="flex gap-4 cursor-pointer"><input type="checkbox" class="consent-check"> <span class="text-xs font-bold">教習所の指示に従い安全を遵守します</span></label>
                    <label class="flex gap-4 cursor-pointer"><input type="checkbox" class="consent-check"> <span class="text-xs font-bold">入力内容に虚偽がないことを確認しました</span></label>
                </div>
                <button type="submit" id="submitBtn" disabled class="cta-button w-full mt-10 bg-gradient-to-r from-sky-500 to-sky-600 text-white py-6 rounded-2xl font-black text-lg italic uppercase shadow-xl">Send Application / 申し込みを送信する</button>
            </section>
        </form>
    </main>

       <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrRf1MMCkR_dTIT4mpz2MWdNPJZt3GpYw",
            authDomain: "stc-hp.firebaseapp.com",
            projectId: "stc-hp",
            storageBucket: "stc-hp.firebasestorage.app",
            messagingSenderId: "795332931918",
            appId: "1:795332931918:web:dee7ea9d9fbe0ab0942e1f"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let photoBase64 = "";

        // 1. URLパラメータ受け取り
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const course = urlParams.get('course');
            const date = urlParams.get('date');
            if (course) {
                const decodedCourse = decodeURIComponent(course);
                document.getElementById('courseName').value = decodedCourse;
                renderDynamicFields(decodedCourse);
            }
            if (date) {
                document.getElementById('courseDate').value = decodeURIComponent(date);
            }
        });

        // 2. 講習別分岐
        function renderDynamicFields(course) {
            const section = document.getElementById('dynamic-section');
            let html = "";
            if (course.includes("小型移動式クレーン")) {
                html = `<section class="form-card p-12 mb-10 animate-fadeIn text-left"><h2 class="section-title text-xl mb-6 italic text-sky-600 uppercase">Qualification</h2><select name="exemption" class="w-full p-4 border rounded-xl font-bold bg-slate-50"><option>玉掛け技能講習修了証所持</option><option>クレーン免許所持</option></select><input type="text" name="licenseNumber" placeholder="免許・修了証番号" class="w-full mt-4 p-4 border rounded-xl font-bold bg-slate-50"></section>`;
            } else if (course.includes("フォークリフト")) {
                html = `<section class="form-card p-12 mb-10 animate-fadeIn text-left"><h2 class="section-title text-xl mb-6 italic text-sky-600 uppercase">Qualification</h2><select name="exemption" class="w-full p-4 border rounded-xl font-bold bg-slate-50"><option>普通免許所持</option><option>特別教育経験者</option></select><input type="text" name="licenseNumber" placeholder="免許証番号" class="w-full mt-4 p-4 border rounded-xl font-bold bg-slate-50"></section>`;
            }
            section.innerHTML = html;
        }

        // 3. 【解決：圧縮機能】 写真処理（サイズを小さくしてからBase64化）
        document.getElementById('photoInput').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = event => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; // 横幅を400pxに制限
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // 画質を0.7（70%）に落として圧縮
                    photoBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('preview').innerHTML = `<img src="${photoBase64}" class="w-full h-full object-cover">`;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // 4. 同意チェック
        const checks = document.querySelectorAll('.consent-check');
        checks.forEach(c => c.addEventListener('change', () => {
            document.getElementById('submitBtn').disabled = !Array.from(checks).every(i => i.checked);
        }));

        // 5. 送信
        document.getElementById('applyForm').addEventListener('submit', async e => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "SENDING...";
            try {
                const formData = new FormData(e.target);
                await addDoc(collection(db, "reservations"), {
                    courseName: document.getElementById('courseName').value,
                    courseDate: document.getElementById('courseDate').value,
                    userName: formData.get('userName'),
                    userKana: formData.get('userKana'),
                    birthDate: formData.get('birthDate'),
                    phone: formData.get('phone'),
                    email: formData.get('email'),
                    address: formData.get('address'),
                    company: formData.get('company') || "",
                    exemption: formData.get('exemption') || "なし",
                    licenseNumber: formData.get('licenseNumber') || "",
                    userPhoto: photoBase64, // 圧縮されたデータ
                    createdAt: serverTimestamp()
                });
                alert("お申し込みありがとうございます！送信が完了しました。");
                window.location.href = "index.html";
            } catch (err) {
                alert("送信エラー: " + err.message);
                btn.disabled = false;
                btn.innerText = "申し込みを送信する";
            }
        });
    </script>
</body>
</html>
